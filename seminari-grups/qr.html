<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accedeix als grups del seminari</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #143554; background: #edf3fa; }
    * { box-sizing: border-box; }
    body { margin: 0; display: grid; min-height: 100vh; place-items: center; padding: 24px; }
    article { width: min(100%, 760px); text-align: center; background: white; padding: clamp(24px, 5vw, 50px); border-radius: 24px; box-shadow: 0 20px 55px #1435541c; }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin: 0 0 10px; }
    p { font-size: clamp(1.1rem, 2.3vw, 1.4rem); line-height: 1.4; }
    img { display: block; width: min(100%, 340px); height: auto; margin: 24px auto; }
    a { color: #1459a0; overflow-wrap: anywhere; }
    small { color: #4c667e; }
    @media print { :root { background: white; } body { display: block; } article { box-shadow: none; width: 100%; } }
  </style>
</head>
<body>
  <article>
    <h1>Troba el teu grup</h1>
    <p>Escaneja el codi amb el mòbil, indica el teu nivell d’experiència i apunta el número de grup que apareixerà a la pantalla.</p>
    <img src="qr-seminari.svg" alt="Codi QR per accedir a l’autoavaluació del seminari">
    <p><a href="https://warholsport.github.io/equips_cooperatius/seminari-grups/">warholsport.github.io/equips_cooperatius/seminari-grups/</a></p>
    <small>Organització: mostra els grups de l’1 al 10 a les taules.</small>
  </article>
</body>
</html>
